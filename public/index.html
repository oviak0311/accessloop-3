<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AccessLoop · Check before you go</title>
  <meta name="description" content="A map of transit accessibility barriers in Toronto. Check a station or stop before you go, and report what you find.">
  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script type="module" src="js/home.js"></script>
</head>
<body class="map-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header"></header>

  <main id="main-content" class="app-map home-app" data-view="map">
    <h1 class="sr-only">AccessLoop map: check stations and stops for barriers</h1>

    <!-- Desktop: a floating column on the left, the stop search on top and details below.
         Phones: the search sits at the top and details open in a bottom sheet. -->
    <div class="side-panel">
      <!-- Floating stop search, top left. It searches the stations and stops in AccessLoop's database. -->
      <section class="planner-card" id="planner" aria-label="Check a station or stop">
        <form class="trip-planner" id="stop-search" role="search" novalidate aria-labelledby="planner-title">
          <div class="planner-head">
            <h2 id="planner-title">Check a station or stop</h2>
          </div>
          <div class="journey-field">
            <label class="sr-only" for="stop-input">Station or stop</label>
            <div class="inline-input">
              <span data-icon="search" data-size="18"></span>
              <input id="stop-input" type="search" autocomplete="off" placeholder="Station, stop or stop number"
                role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="stop-results">
            </div>
            <ul class="journey-suggestions" id="stop-results" role="listbox" aria-label="Stations and stops" hidden></ul>
          </div>
        </form>
      </section>
      <!-- Details panel: a barrier's details on phones, or a stop with no open barriers.
           Hidden while there's nothing to show, so the map fills the screen. -->
      <section class="sheet" id="sheet" data-state="half" aria-labelledby="sheet-title" hidden>
        <div class="sheet-bar">
          <button type="button" class="sheet-handle" aria-expanded="true" aria-controls="sheet-body">
            <span class="sheet-grip" aria-hidden="true"></span>
            <span class="sheet-title" id="sheet-title"></span>
            <span class="sheet-chevron" data-icon="expand" data-size="18"></span>
          </button>
          <button type="button" class="sheet-expand" aria-label="Make the panel bigger">
            <span data-icon="expand" data-size="18"></span>
          </button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </section>
    </div>

    <a class="map-skip" href="#report-button">Skip the map</a>
    <div id="map" class="leaflet-map" role="region" aria-label="Map of transit accessibility barriers"></div>

    <!-- Map tools, top right (zoom buttons are added by the map) -->
    <button class="map-tool locate-tool" id="locate-button" type="button"
      aria-label="Locate me and centre the map. Your location stays in this browser.">
      <span data-icon="location"></span><span id="locate-label">Locate me</span>
    </button>
    <div class="map-legend" id="map-legend" role="group" aria-label="Map pin legend"></div>

    <!-- Report without leaving the map -->
    <button class="floating-report" id="report-button" type="button" aria-expanded="false" aria-controls="quick-report">
      <span><span data-icon="plus" data-size="26"></span></span>Report
    </button>
    <dialog class="quick-report" id="quick-report" aria-labelledby="quick-report-title"></dialog>


    <p class="sr-only" id="app-status" role="status" aria-live="polite"></p>
  </main>

</body>
</html>
